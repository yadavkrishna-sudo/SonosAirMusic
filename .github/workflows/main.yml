name: Build Sonos APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Find Project Root and Build APK
        run: |
          echo "=== Repository Structure ==="
          find . -maxdepth 4 -not -path '*/.*'
          SETTINGS_FILE=$(find . -name "settings.gradle" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "❌ ERROR: settings.gradle was not uploaded to GitHub!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "✅ Found Android project in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: Sonos-AirStream-APK
          path: "**/build/outputs/apk/debug/app-debug.apk"
