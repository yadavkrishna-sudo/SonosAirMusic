name: Build Sonos APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Gradle 8.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          sudo unzip -q -d /opt/gradle gradle-8.5-bin.zip
          echo "/opt/gradle/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Generate Project & Compile APK
        run: |
          mkdir -p sonos_build/app/src/main/java/com/example/airstreamclone
          cd sonos_build

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SonosAirStream"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.airstreamclone'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.airstreamclone"
                  minSdk 29
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.activity:activity-ktx:1.8.2'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:label="Sonos AirStream"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".AudioStreamService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/airstreamclone/SonosController.kt
          package com.example.airstreamclone

          import java.io.OutputStreamWriter
          import java.net.DatagramPacket
          import java.net.DatagramSocket
          import java.net.HttpURLConnection
          import java.net.InetAddress
          import java.net.URL

          object SonosController {

              fun discoverSonosIp(timeoutMs: Int = 3000): String? {
                  val searchMessage = buildString {
                      append("M-SEARCH * HTTP/1.1\r\n")
                      append("HOST: 239.255.255.250:1900\r\n")
                      append("MAN: \"ssdp:discover\"\r\n")
                      append("MX: 2\r\n")
                      append("ST: urn:schemas-upnp-org:device:ZonePlayer:1\r\n\r\n")
                  }

                  var socket: DatagramSocket? = null
                  try {
                      socket = DatagramSocket()
                      socket.soTimeout = timeoutMs
                      val data = searchMessage.toByteArray()
                      val packet = DatagramPacket(
                          data, data.size,
                          InetAddress.getByName("239.255.255.250"), 1900
                      )
                      socket.send(packet)

                      val rxBuf = ByteArray(2048)
                      val rxPacket = DatagramPacket(rxBuf, rxBuf.size)
                      while (true) {
                          socket.receive(rxPacket)
                          val response = String(rxPacket.data, 0, rxPacket.length)
                          if (response.contains("Sonos", ignoreCase = true)) {
                              return rxPacket.address.hostAddress
                          }
                      }
                  } catch (e: Exception) {
                      e.printStackTrace()
                  } finally {
                      socket?.close()
                  }
                  return null
              }

              fun startSonosStream(sonosIp: String, phoneIp: String, httpPort: Int) {
                  val streamUrl = "http://$phoneIp:$httpPort/live.wav"

                  val setUriBody = """
                      <?xml version="1.0" encoding="utf-8"?>
                      <s:Envelope xmlns:s="http://schemas.xmlsoap.org/soap/envelope/" s:encodingStyle="http://schemas.xmlsoap.org/soap/encoding/">
                          <s:Body>
                              <u:SetAVTransportURI xmlns:u="urn:schemas-upnp-org:service:AVTransport:1">
                                  <InstanceID>0</InstanceID>
                                  <CurrentURI>$streamUrl</CurrentURI>
                                  <CurrentURIMetaData></CurrentURIMetaData>
                              </u:SetAVTransportURI>
                          </s:Body>
                      </s:Envelope>
                  """.trimIndent()

                  val playBody = """
                      <?xml version="1.0" encoding="utf-8"?>
                      <s:Envelope xmlns:s="http://schemas.xmlsoap.org/soap/envelope/" s:encodingStyle="http://schemas.xmlsoap.org/soap/encoding/">
                          <s:Body>
                              <u:Play xmlns:u="urn:schemas-upnp-org:service:AVTransport:1">
                                  <InstanceID>0</InstanceID>
                                  <Speed>1</Speed>
                              </u:Play>
                          </s:Body>
                      </s:Envelope>
                  """.trimIndent()

                  sendSoapAction(sonosIp, "SetAVTransportURI", setUriBody)
                  sendSoapAction(sonosIp, "Play", playBody)
              }

              fun stopSonosStream(sonosIp: String) {
                  val stopBody = """
                      <?xml version="1.0" encoding="utf-8"?>
                      <s:Envelope xmlns:s="http://schemas.xmlsoap.org/soap/envelope/" s:encodingStyle="http://schemas.xmlsoap.org/soap/encoding/">
                          <s:Body>
                              <u:Stop xmlns:u="urn:schemas-upnp-org:service:AVTransport:1">
                                  <InstanceID>0</InstanceID>
                              </u:Stop>
                          </s:Body>
                      </s:Envelope>
                  """.trimIndent()
                  sendSoapAction(sonosIp, "Stop", stopBody)
              }

              private fun sendSoapAction(sonosIp: String, action: String, xmlBody: String) {
                  try {
                      val url = URL("http://$sonosIp:1400/MediaRenderer/AVTransport/Control")
                      val conn = url.openConnection() as HttpURLConnection
                      conn.requestMethod = "POST"
                      conn.doOutput = true
                      conn.setRequestProperty("Content-Type", "text/xml; charset=\"utf-8\"")
                      conn.setRequestProperty("SOAPAction", "\"urn:schemas-upnp-org:service:AVTransport:1#$action\"")

                      OutputStreamWriter(conn.outputStream).use { writer ->
                          writer.write(xmlBody)
                          writer.flush()
                      }
                      conn.responseCode
                      conn.disconnect()
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/airstreamclone/AudioStreamService.kt
          package com.example.airstreamclone

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.media.*
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.net.wifi.WifiManager
          import android.os.Build
          import android.os.IBinder
          import android.text.format.Formatter
          import androidx.core.app.NotificationCompat
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.net.ServerSocket
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import kotlin.concurrent.thread

          class AudioStreamService : Service() {

              private var mediaProjection: MediaProjection? = null
              private var audioRecord: AudioRecord? = null
              private var serverSocket: ServerSocket? = null
              private var isStreaming = false
              private var currentSonosIp: String? = null

              companion object {
                  const val ACTION_START = "ACTION_START"
                  const val ACTION_STOP = "ACTION_STOP"
                  const val EXTRA_RESULT_CODE = "EXTRA_RESULT_CODE"
                  const val EXTRA_RESULT_DATA = "EXTRA_RESULT_DATA"
                  const val EXTRA_SONOS_IP = "EXTRA_SONOS_IP"

                  private const val SAMPLE_RATE = 44100
                  private const val CHANNELS = 2
                  private const val BITS_PER_SAMPLE = 16
                  private const val HTTP_PORT = 8080
                  private const val NOTIFICATION_ID = 101
                  private const val CHANNEL_ID = "SonosStreamChannel"
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (intent?.action) {
                      ACTION_START -> {
                          startForegroundServiceNotification()
                          val resultCode = intent.getIntExtra(EXTRA_RESULT_CODE, Activity.RESULT_CANCELED)
                          @Suppress("DEPRECATION")
                          val resultData = intent.getParcelableExtra<Intent>(EXTRA_RESULT_DATA)
                          currentSonosIp = intent.getStringExtra(EXTRA_SONOS_IP)

                          if (resultData != null && currentSonosIp != null) {
                              startSonosStreaming(resultCode, resultData, currentSonosIp!!)
                          }
                      }
                      ACTION_STOP -> stopStreaming()
                  }
                  return START_NOT_STICKY
              }

              private fun startSonosStreaming(resultCode: Int, resultData: Intent, sonosIp: String) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q) return

                  val projectionManager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  mediaProjection = projectionManager.getMediaProjection(resultCode, resultData)

                  val config = AudioPlaybackCaptureConfiguration.Builder(mediaProjection!!)
                      .addMatchingUsage(AudioAttributes.USAGE_MEDIA)
                      .addMatchingUsage(AudioAttributes.USAGE_GAME)
                      .addMatchingUsage(AudioAttributes.USAGE_UNKNOWN)
                      .build()

                  val audioFormat = AudioFormat.Builder()
                      .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                      .setSampleRate(SAMPLE_RATE)
                      .setChannelMask(AudioFormat.CHANNEL_IN_STEREO)
                      .build()

                  val minBufferSize = AudioRecord.getMinBufferSize(
                      SAMPLE_RATE,
                      AudioFormat.CHANNEL_IN_STEREO,
                      AudioFormat.ENCODING_PCM_16BIT
                  )
                  val bufferSize = minBufferSize * 2

                  try {
                      audioRecord = AudioRecord.Builder()
                          .setAudioFormat(audioFormat)
                          .setBufferSizeInBytes(bufferSize)
                          .setAudioPlaybackCaptureConfig(config)
                          .build()

                      audioRecord?.startRecording()
                      isStreaming = true

                      thread(start = true, name = "HttpWavServerThread") {
                          runHttpWavServer(bufferSize)
                      }

                      thread(start = true, name = "SonosControlThread") {
                          Thread.sleep(500)
                          val phoneIp = getLocalIpAddress()
                          SonosController.startSonosStream(sonosIp, phoneIp, HTTP_PORT)
                      }
                  } catch (e: SecurityException) {
                      e.printStackTrace()
                      stopStreaming()
                  }
              }

              private fun runHttpWavServer(bufferSize: Int) {
                  try {
                      serverSocket = ServerSocket(HTTP_PORT)
                      val pcmBuffer = ByteArray(bufferSize)

                      while (isStreaming) {
                          val client = serverSocket?.accept() ?: break
                          thread(start = true) {
                              try {
                                  val reader = BufferedReader(InputStreamReader(client.getInputStream()))
                                  val requestLine = reader.readLine() ?: ""
                                  while (reader.readLine().isNullOrEmpty().not()) {}

                                  val output = client.getOutputStream()

                                  if (requestLine.startsWith("HEAD")) {
                                      val headResponse = "HTTP/1.1 200 OK\r\n" +
                                              "Content-Type: audio/wav\r\n" +
                                              "Connection: close\r\n\r\n"
                                      output.write(headResponse.toByteArray())
                                      output.flush()
                                      client.close()
                                      return@thread
                                  }

                                  val httpHeaders = "HTTP/1.1 200 OK\r\n" +
                                          "Content-Type: audio/wav\r\n" +
                                          "Cache-Control: no-cache\r\n" +
                                          "Connection: keep-alive\r\n\r\n"
                                  output.write(httpHeaders.toByteArray())
                                  output.write(createInfiniteWavHeader())
                                  output.flush()

                                  while (isStreaming && !client.isClosed) {
                                      val read = audioRecord?.read(pcmBuffer, 0, pcmBuffer.size) ?: 0
                                      if (read > 0) {
                                          output.write(pcmBuffer, 0, read)
                                          output.flush()
                                      }
                                  }
                              } catch (e: Exception) {
                                  e.printStackTrace()
                              } finally {
                                  client.close()
                              }
                          }
                      }
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              private fun createInfiniteWavHeader(): ByteArray {
                  val byteRate = SAMPLE_RATE * CHANNELS * BITS_PER_SAMPLE / 8
                  val blockAlign = (CHANNELS * BITS_PER_SAMPLE / 8).toShort()
                  val maxDataSize = Int.MAX_VALUE - 36

                  val buffer = ByteBuffer.allocate(44).order(ByteOrder.LITTLE_ENDIAN)
                  buffer.put("RIFF".toByteArray())
                  buffer.putInt(Int.MAX_VALUE)
                  buffer.put("WAVE".toByteArray())
                  buffer.put("fmt ".toByteArray())
                  buffer.putInt(16)
                  buffer.putShort(1)
                  buffer.putShort(CHANNELS.toShort())
                  buffer.putInt(SAMPLE_RATE)
                  buffer.putInt(byteRate)
                  buffer.putShort(blockAlign)
                  buffer.putShort(BITS_PER_SAMPLE.toShort())
                  buffer.put("data".toByteArray())
                  buffer.putInt(maxDataSize)
                  return buffer.array()
              }

              @Suppress("DEPRECATION")
              private fun getLocalIpAddress(): String {
                  val wifiManager = applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                  return Formatter.formatIpAddress(wifiManager.connectionInfo.ipAddress)
              }

              private fun stopStreaming() {
                  isStreaming = false
                  currentSonosIp?.let { ip ->
                      thread { SonosController.stopSonosStream(ip) }
                  }
                  try {
                      serverSocket?.close()
                  } catch (e: Exception) {}
                  audioRecord?.stop()
                  audioRecord?.release()
                  audioRecord = null
                  mediaProjection?.stop()
                  mediaProjection = null
                  stopForeground(STOP_FOREGROUND_REMOVE)
                  stopSelf()
              }

              private fun startForegroundServiceNotification() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          CHANNEL_ID, "Sonos Audio Streamer", NotificationManager.IMPORTANCE_LOW
                      )
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }
                  val notification = NotificationCompat.Builder(this, CHANNEL_ID)
                      .setContentTitle("Streaming to Sonos Play:1")
                      .setContentText("Live HTTP WAV Audio Capture Active")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .build()
                  startForeground(NOTIFICATION_ID, notification)
              }

              override fun onDestroy() {
                  stopStreaming()
                  super.onDestroy()
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/airstreamclone/MainActivity.kt
          package com.example.airstreamclone

          import android.Manifest
          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Bundle
          import android.widget.*
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import kotlin.concurrent.thread

          class MainActivity : AppCompatActivity() {

              private lateinit var ipInput: EditText
              private lateinit var statusText: TextView

              private val mediaProjectionLauncher = registerForActivityResult(
                  ActivityResultContracts.StartActivityForResult()
              ) { result ->
                  val sonosIp = ipInput.text.toString().trim()
                  if (result.resultCode == Activity.RESULT_OK && result.data != null && sonosIp.isNotEmpty()) {
                      val serviceIntent = Intent(this, AudioStreamService::class.java).apply {
                          action = AudioStreamService.ACTION_START
                          putExtra(AudioStreamService.EXTRA_RESULT_CODE, result.resultCode)
                          putExtra(AudioStreamService.EXTRA_RESULT_DATA, result.data)
                          putExtra(AudioStreamService.EXTRA_SONOS_IP, sonosIp)
                      }
                      ContextCompat.startForegroundService(this, serviceIntent)
                      statusText.text = "Status: Streaming live WAV to Sonos ($sonosIp)..."
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 48, 48, 48)
                  }

                  statusText = TextView(this).apply {
                      text = "Status: Searching for Sonos Play:1..."
                      textSize = 16f
                  }

                  ipInput = EditText(this).apply {
                      hint = "Sonos Play:1 IP (e.g. 192.168.1.50)"
                  }

                  val btnDiscover = Button(this).apply { text = "Auto-Discover Sonos Play:1" }
                  val btnStart = Button(this).apply { text = "Start Streaming to Sonos" }
                  val btnStop = Button(this).apply { text = "Stop Stream" }

                  btnDiscover.setOnClickListener { discoverSonos() }

                  btnStart.setOnClickListener {
                      if (ipInput.text.toString().trim().isEmpty()) {
                          Toast.makeText(this, "Enter or discover Sonos IP first", Toast.LENGTH_SHORT).show()
                          return@setOnClickListener
                      }
                      if (checkPermissions()) {
                          val projectionManager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                          mediaProjectionLauncher.launch(projectionManager.createScreenCaptureIntent())
                      }
                  }

                  btnStop.setOnClickListener {
                      val stopIntent = Intent(this, AudioStreamService::class.java).apply {
                          action = AudioStreamService.ACTION_STOP
                      }
                      startService(stopIntent)
                      statusText.text = "Status: Stream Stopped"
                  }

                  layout.addView(statusText)
                  layout.addView(ipInput)
                  layout.addView(btnDiscover)
                  layout.addView(btnStart)
                  layout.addView(btnStop)
                  setContentView(layout)

                  discoverSonos()
              }

              private fun discoverSonos() {
                  statusText.text = "Status: Scanning Wi-Fi for Sonos Play:1 (SSDP)..."
                  thread {
                      val foundIp = SonosController.discoverSonosIp()
                      runOnUiThread {
                          if (foundIp != null) {
                              ipInput.setText(foundIp)
                              statusText.text = "Status: Found Sonos at $foundIp"
                          } else {
                              statusText.text = "Status: Auto-discovery timed out. Enter Sonos IP manually."
                          }
                      }
                  }
              }

              private fun checkPermissions(): Boolean {
                  val permissions = mutableListOf(Manifest.permission.RECORD_AUDIO)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      permissions.add(Manifest.permission.POST_NOTIFICATIONS)
                  }
                  val missing = permissions.filter {
                      ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED
                  }
                  if (missing.isNotEmpty()) {
                      ActivityCompat.requestPermissions(this, missing.toTypedArray(), 100)
                      return false
                  }
                  return true
              }
          }
          EOF

          gradle assembleDebug --no-build-cache --no-daemon --stacktrace

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH="sonos_build/app/build/outputs/apk/debug/app-debug.apk"
          cp "$APK_PATH" ./Sonos-AirStream.apk
          gh release delete v1.0 -y || true
          gh release create v1.0 ./Sonos-AirStream.apk --title "Sonos AirStream APK v1.0" --notes "Direct APK download for Android."
