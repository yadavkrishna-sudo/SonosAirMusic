name: Build Sonos APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Gradle 8.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          sudo unzip -q -d /opt/gradle gradle-8.5-bin.zip
          echo "/opt/gradle/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Generate Project and Compile APK
        run: |
          mkdir -p sonos_build/app/src/main/java/com/example/airstreamclone
          cd sonos_build

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SonosAirStream"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.airstreamclone'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.airstreamclone"
                  minSdk 29
                  targetSdk 34
                  versionCode 3
                  versionName "3.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.activity:activity-ktx:1.8.2'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:label="Sonos AirStream"
                  android:usesCleartextTraffic="true"
                  android:allowAudioPlaybackCapture="true"
                  android:hardwareAccelerated="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".AudioStreamService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/airstreamclone/SonosController.kt
          package com.example.airstreamclone

          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.io.OutputStreamWriter
          import java.net.DatagramPacket
          import java.net.DatagramSocket
          import java.net.HttpURLConnection
          import java.net.InetAddress
          import java.net.URL

          object SonosController {

              fun discoverSonosIp(timeoutMs: Int = 3000): String? {
                  val searchMessage = buildString {
                      append("M-SEARCH * HTTP/1.1\r\n")
                      append("HOST: 239.255.255.250:1900\r\n")
                      append("MAN: \"ssdp:discover\"\r\n")
                      append("MX: 2\r\n")
                      append("ST: urn:schemas-upnp-org:device:ZonePlayer:1\r\n\r\n")
                  }

                  var socket: DatagramSocket? = null
                  try {
                      socket = DatagramSocket()
                      socket.soTimeout = timeoutMs
                      val data = searchMessage.toByteArray()
                      val packet = DatagramPacket(
                          data, data.size,
                          InetAddress.getByName("239.255.255.250"), 1900
                      )
                      socket.send(packet)

                      val rxBuf = ByteArray(2048)
                      val rxPacket = DatagramPacket(rxBuf, rxBuf.size)
                      while (true) {
                          socket.receive(rxPacket)
                          val response = String(rxPacket.data, 0, rxPacket.length)
                          if (response.contains("Sonos", ignoreCase = true)) {
                              return rxPacket.address.hostAddress
                          }
                      }
                  } catch (e: Exception) {
                      e.printStackTrace()
                  } finally {
                      socket?.close()
                  }
                  return null
              }

              fun startSonosStream(sonosIp: String, phoneIp: String, httpPort: Int) {
                  val streamUrl = "http://$phoneIp:$httpPort/live.wav"

                  val setUriBody = """
                      <?xml version="1.0" encoding="utf-8"?>
                      <s:Envelope xmlns:s="http://schemas.xmlsoap.org/soap/envelope/" s:encodingStyle="http://schemas.xmlsoap.org/soap/encoding/">
                          <s:Body>
                              <u:SetAVTransportURI xmlns:u="urn:schemas-upnp-org:service:AVTransport:1">
                                  <InstanceID>0</InstanceID>
                                  <CurrentURI>$streamUrl</CurrentURI>
                                  <CurrentURIMetaData></CurrentURIMetaData>
                              </u:SetAVTransportURI>
                          </s:Body>
                      </s:Envelope>
                  """.trimIndent()

                  val playBody = """
                      <?xml version="1.0" encoding="utf-8"?>
                      <s:Envelope xmlns:s="http://schemas.xmlsoap.org/soap/envelope/" s:encodingStyle="http://schemas.xmlsoap.org/soap/encoding/">
                          <s:Body>
                              <u:Play xmlns:u="urn:schemas-upnp-org:service:AVTransport:1">
                                  <InstanceID>0</InstanceID>
                                  <Speed>1</Speed>
                              </u:Play>
                          </s:Body>
                      </s:Envelope>
                  """.trimIndent()

                  sendSoapAction(
                      sonosIp,
                      "/MediaRenderer/AVTransport/Control",
                      "urn:schemas-upnp-org:service:AVTransport:1#SetAVTransportURI",
                      setUriBody
                  )
                  sendSoapAction(
                      sonosIp,
                      "/MediaRenderer/AVTransport/Control",
                      "urn:schemas-upnp-org:service:AVTransport:1#Play",
                      playBody
                  )
              }

              fun stopSonosStream(sonosIp: String) {
                  val stopBody = """
                      <?xml version="1.0" encoding="utf-8"?>
                      <s:Envelope xmlns:s="http://schemas.xmlsoap.org/soap/envelope/" s:encodingStyle="http://schemas.xmlsoap.org/soap/encoding/">
                          <s:Body>
                              <u:Stop xmlns:u="urn:schemas-upnp-org:service:AVTransport:1">
                                  <InstanceID>0</InstanceID>
                              </u:Stop>
                          </s:Body>
                      </s:Envelope>
                  """.trimIndent()
                  sendSoapAction(
                      sonosIp,
                      "/MediaRenderer/AVTransport/Control",
                      "urn:schemas-upnp-org:service:AVTransport:1#Stop",
                      stopBody
                  )
              }

              /**
               * Sets the Sonos Play:1 hardware volume (0 to 100) via UPnP RenderingControl.
               */
              fun setSonosVolume(sonosIp: String, volume: Int) {
                  val clampedVol = volume.coerceIn(0, 100)
                  val volumeBody = """
                      <?xml version="1.0" encoding="utf-8"?>
                      <s:Envelope xmlns:s="http://schemas.xmlsoap.org/soap/envelope/" s:encodingStyle="http://schemas.xmlsoap.org/soap/encoding/">
                          <s:Body>
                              <u:SetVolume xmlns:u="urn:schemas-upnp-org:service:RenderingControl:1">
                                  <InstanceID>0</InstanceID>
                                  <Channel>Master</Channel>
                                  <DesiredVolume>$clampedVol</DesiredVolume>
                              </u:SetVolume>
                          </s:Body>
                      </s:Envelope>
                  """.trimIndent()
                  sendSoapAction(
                      sonosIp,
                      "/MediaRenderer/RenderingControl/Control",
                      "urn:schemas-upnp-org:service:RenderingControl:1#SetVolume",
                      volumeBody
                  )
              }

              /**
               * Reads the current volume (0 to 100) directly from the Sonos Play:1 speaker.
               */
              fun getSonosVolume(sonosIp: String): Int? {
                  val getVolBody = """
                      <?xml version="1.0" encoding="utf-8"?>
                      <s:Envelope xmlns:s="http://schemas.xmlsoap.org/soap/envelope/" s:encodingStyle="http://schemas.xmlsoap.org/soap/encoding/">
                          <s:Body>
                              <u:GetVolume xmlns:u="urn:schemas-upnp-org:service:RenderingControl:1">
                                  <InstanceID>0</InstanceID>
                                  <Channel>Master</Channel>
                              </u:GetVolume>
                          </s:Body>
                      </s:Envelope>
                  """.trimIndent()

                  val responseXml = sendSoapAction(
                      sonosIp,
                      "/MediaRenderer/RenderingControl/Control",
                      "urn:schemas-upnp-org:service:RenderingControl:1#GetVolume",
                      getVolBody
                  ) ?: return null

                  val regex = Regex("<CurrentVolume>(\\d+)</CurrentVolume>")
                  val match = regex.find(responseXml)
                  return match?.groupValues?.get(1)?.toIntOrNull()
              }

              private fun sendSoapAction(
                  sonosIp: String,
                  endpoint: String,
                  soapAction: String,
                  xmlBody: String
              ): String? {
                  try {
                      val url = URL("http://$sonosIp:1400$endpoint")
                      val conn = url.openConnection() as HttpURLConnection
                      conn.connectTimeout = 2500
                      conn.readTimeout = 2500
                      conn.requestMethod = "POST"
                      conn.doOutput = true
                      conn.setRequestProperty("Content-Type", "text/xml; charset=\"utf-8\"")
                      conn.setRequestProperty("SOAPAction", "\"$soapAction\"")

                      OutputStreamWriter(conn.outputStream).use { writer ->
                          writer.write(xmlBody)
                          writer.flush()
                      }

                      val responseText = if (conn.responseCode in 200..299) {
                          BufferedReader(InputStreamReader(conn.inputStream)).use { it.readText() }
                      } else {
                          null
                      }
                      conn.disconnect()
                      return responseText
                  } catch (e: Exception) {
                      e.printStackTrace()
                      return null
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/airstreamclone/AudioStreamService.kt
          package com.example.airstreamclone

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.media.*
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.net.wifi.WifiManager
          import android.os.Build
          import android.os.IBinder
          import android.text.format.Formatter
          import androidx.core.app.NotificationCompat
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.net.ServerSocket
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import kotlin.concurrent.thread

          class AudioStreamService : Service() {

              private var mediaProjection: MediaProjection? = null
              private var audioRecord: AudioRecord? = null
              private var serverSocket: ServerSocket? = null
              private var isStreaming = false
              private var currentSonosIp: String? = null

              companion object {
                  const val ACTION_START = "ACTION_START"
                  const val ACTION_STOP = "ACTION_STOP"
                  const val EXTRA_RESULT_CODE = "EXTRA_RESULT_CODE"
                  const val EXTRA_RESULT_DATA = "EXTRA_RESULT_DATA"
                  const val EXTRA_SONOS_IP = "EXTRA_SONOS_IP"

                  private const val SAMPLE_RATE = 44100
                  private const val CHANNELS = 2
                  private const val BITS_PER_SAMPLE = 16
                  private const val HTTP_PORT = 8080
                  private const val NOTIFICATION_ID = 101
                  private const val CHANNEL_ID = "SonosStreamChannel"
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (intent?.action) {
                      ACTION_START -> {
                          startForegroundServiceNotification()
                          val resultCode = intent.getIntExtra(EXTRA_RESULT_CODE, Activity.RESULT_CANCELED)
                          @Suppress("DEPRECATION")
                          val resultData = intent.getParcelableExtra<Intent>(EXTRA_RESULT_DATA)
                          currentSonosIp = intent.getStringExtra(EXTRA_SONOS_IP)

                          if (resultData != null && currentSonosIp != null) {
                              startSonosStreaming(resultCode, resultData, currentSonosIp!!)
                          }
                      }
                      ACTION_STOP -> stopStreaming()
                  }
                  return START_NOT_STICKY
              }

              private fun startSonosStreaming(resultCode: Int, resultData: Intent, sonosIp: String) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q) return

                  val projectionManager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  mediaProjection = projectionManager.getMediaProjection(resultCode, resultData)

                  val config = AudioPlaybackCaptureConfiguration.Builder(mediaProjection!!)
                      .addMatchingUsage(AudioAttributes.USAGE_MEDIA)
                      .addMatchingUsage(AudioAttributes.USAGE_GAME)
                      .addMatchingUsage(AudioAttributes.USAGE_UNKNOWN)
                      .build()

                  val audioFormat = AudioFormat.Builder()
                      .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                      .setSampleRate(SAMPLE_RATE)
                      .setChannelMask(AudioFormat.CHANNEL_IN_STEREO)
                      .build()

                  val minBufferSize = AudioRecord.getMinBufferSize(
                      SAMPLE_RATE,
                      AudioFormat.CHANNEL_IN_STEREO,
                      AudioFormat.ENCODING_PCM_16BIT
                  )
                  val bufferSize = minBufferSize * 2

                  try {
                      audioRecord = AudioRecord.Builder()
                          .setAudioFormat(audioFormat)
                          .setBufferSizeInBytes(bufferSize)
                          .setAudioPlaybackCaptureConfig(config)
                          .build()

                      audioRecord?.startRecording()
                      isStreaming = true

                      thread(start = true, name = "HttpWavServerThread") {
                          runHttpWavServer(bufferSize)
                      }

                      thread(start = true, name = "SonosControlThread") {
                          Thread.sleep(500)
                          val phoneIp = getLocalIpAddress()
                          SonosController.startSonosStream(sonosIp, phoneIp, HTTP_PORT)
                      }
                  } catch (e: SecurityException) {
                      e.printStackTrace()
                      stopStreaming()
                  }
              }

              private fun runHttpWavServer(bufferSize: Int) {
                  try {
                      serverSocket = ServerSocket(HTTP_PORT)
                      val pcmBuffer = ByteArray(bufferSize)

                      while (isStreaming) {
                          val client = serverSocket?.accept() ?: break
                          thread(start = true) {
                              try {
                                  val reader = BufferedReader(InputStreamReader(client.getInputStream()))
                                  val requestLine = reader.readLine() ?: ""
                                  while (reader.readLine().isNullOrEmpty().not()) {}

                                  val output = client.getOutputStream()

                                  if (requestLine.startsWith("HEAD")) {
                                      val headResponse = "HTTP/1.1 200 OK\r\n" +
                                              "Content-Type: audio/wav\r\n" +
                                              "Connection: close\r\n\r\n"
                                      output.write(headResponse.toByteArray())
                                      output.flush()
                                      client.close()
                                      return@thread
                                  }

                                  val httpHeaders = "HTTP/1.1 200 OK\r\n" +
                                          "Content-Type: audio/wav\r\n" +
                                          "Cache-Control: no-cache\r\n" +
                                          "Connection: keep-alive\r\n\r\n"
                                  output.write(httpHeaders.toByteArray())
                                  output.write(createInfiniteWavHeader())
                                  output.flush()

                                  while (isStreaming && !client.isClosed) {
                                      val read = audioRecord?.read(pcmBuffer, 0, pcmBuffer.size) ?: 0
                                      if (read > 0) {
                                          output.write(pcmBuffer, 0, read)
                                          output.flush()
                                      }
                                  }
                              } catch (e: Exception) {
                                  e.printStackTrace()
                              } finally {
                                  client.close()
                              }
                          }
                      }
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              private fun createInfiniteWavHeader(): ByteArray {
                  val byteRate = SAMPLE_RATE * CHANNELS * BITS_PER_SAMPLE / 8
                  val blockAlign = (CHANNELS * BITS_PER_SAMPLE / 8).toShort()
                  val maxDataSize = Int.MAX_VALUE - 36

                  val buffer = ByteBuffer.allocate(44).order(ByteOrder.LITTLE_ENDIAN)
                  buffer.put("RIFF".toByteArray())
                  buffer.putInt(Int.MAX_VALUE)
                  buffer.put("WAVE".toByteArray())
                  buffer.put("fmt ".toByteArray())
                  buffer.putInt(16)
                  buffer.putShort(1)
                  buffer.putShort(CHANNELS.toShort())
                  buffer.putInt(SAMPLE_RATE)
                  buffer.putInt(byteRate)
                  buffer.putShort(blockAlign)
                  buffer.putShort(BITS_PER_SAMPLE.toShort())
                  buffer.put("data".toByteArray())
                  buffer.putInt(maxDataSize)
                  return buffer.array()
              }

              @Suppress("DEPRECATION")
              private fun getLocalIpAddress(): String {
                  val wifiManager = applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                  return Formatter.formatIpAddress(wifiManager.connectionInfo.ipAddress)
              }

              private fun stopStreaming() {
                  isStreaming = false
                  currentSonosIp?.let { ip ->
                      thread { SonosController.stopSonosStream(ip) }
                  }
                  try {
                      serverSocket?.close()
                  } catch (e: Exception) {}
                  audioRecord?.stop()
                  audioRecord?.release()
                  audioRecord = null
                  mediaProjection?.stop()
                  mediaProjection = null
                  stopForeground(STOP_FOREGROUND_REMOVE)
                  stopSelf()
              }

              private fun startForegroundServiceNotification() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          CHANNEL_ID, "Sonos Audio Streamer", NotificationManager.IMPORTANCE_LOW
                      )
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }
                  val notification = NotificationCompat.Builder(this, CHANNEL_ID)
                      .setContentTitle("Streaming to Sonos Play:1")
                      .setContentText("Live HTTP WAV Audio Capture Active")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .build()
                  startForeground(NOTIFICATION_ID, notification)
              }

              override fun onDestroy() {
                  stopStreaming()
                  super.onDestroy()
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/airstreamclone/MainActivity.kt
          package com.example.airstreamclone

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Bundle
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.View
          import android.webkit.*
          import android.widget.*
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import kotlin.concurrent.thread

          class BackgroundAudioWebView(context: Context) : WebView(context) {
              override fun onWindowVisibilityChanged(visibility: Int) {
                  super.onWindowVisibilityChanged(View.VISIBLE)
              }
          }

          class MainActivity : AppCompatActivity() {

              private lateinit var ipInput: EditText
              private lateinit var statusText: TextView
              private lateinit var volumeLabel: TextView
              private lateinit var volumeSeekBar: SeekBar
              private lateinit var webView: WebView

              private val mediaProjectionLauncher = registerForActivityResult(
                  ActivityResultContracts.StartActivityForResult()
              ) { result ->
                  val sonosIp = ipInput.text.toString().trim()
                  if (result.resultCode == Activity.RESULT_OK && result.data != null && sonosIp.isNotEmpty()) {
                      val serviceIntent = Intent(this, AudioStreamService::class.java).apply {
                          action = AudioStreamService.ACTION_START
                          putExtra(AudioStreamService.EXTRA_RESULT_CODE, result.resultCode)
                          putExtra(AudioStreamService.EXTRA_RESULT_DATA, result.data)
                          putExtra(AudioStreamService.EXTRA_SONOS_IP, sonosIp)
                      }
                      ContextCompat.startForegroundService(this, serviceIntent)
                      statusText.text = "Streaming live WAV to Sonos ($sonosIp)"
                  }
              }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val rootLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.MATCH_PARENT
                      )
                  }

                  val controlsBox = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(24, 12, 24, 6)
                  }

                  statusText = TextView(this).apply {
                      text = "Scanning Wi-Fi for Sonos Play:1..."
                      textSize = 12f
                  }

                  // Row 1: Sonos IP + Scan + Stream + Stop
                  val sonosRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                  }

                  ipInput = EditText(this).apply {
                      hint = "Sonos IP"
                      textSize = 13f
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1.5f)
                  }

                  val btnDiscover = Button(this).apply {
                      text = "Scan"
                      textSize = 11f
                  }
                  val btnStart = Button(this).apply {
                      text = "Stream"
                      textSize = 11f
                  }
                  val btnStop = Button(this).apply {
                      text = "Stop"
                      textSize = 11f
                  }

                  sonosRow.addView(ipInput)
                  sonosRow.addView(btnDiscover)
                  sonosRow.addView(btnStart)
                  sonosRow.addView(btnStop)

                  // Row 2: Sonos Hardware Volume Slider (0 - 100%)
                  val volumeRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, 4, 0, 4)
                  }

                  volumeLabel = TextView(this).apply {
                      text = "Sonos Vol: 25%"
                      textSize = 12f
                  }

                  volumeSeekBar = SeekBar(this).apply {
                      max = 100
                      progress = 25
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }

                  volumeSeekBar.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(seekBar: SeekBar?, progress: Int, fromUser: Boolean) {
                          volumeLabel.text = "Sonos Vol: $progress%"
                          if (fromUser) {
                              val sonosIp = ipInput.text.toString().trim()
                              if (sonosIp.isNotEmpty()) {
                                  thread { SonosController.setSonosVolume(sonosIp, progress) }
                              }
                          }
                      }
                      override fun onStartTrackingTouch(seekBar: SeekBar?) {}
                      override fun onStopTrackingTouch(seekBar: SeekBar?) {}
                  })

                  volumeRow.addView(volumeLabel)
                  volumeRow.addView(volumeSeekBar)

                  // Row 3: Quick-Launch Music Source Tabs
                  val quickTabsRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                  }

                  val btnSpotify = Button(this).apply {
                      text = "Spotify Web"
                      textSize = 11f
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }
                  val btnSoundCloud = Button(this).apply {
                      text = "SoundCloud"
                      textSize = 11f
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }
                  val btnYouTube = Button(this).apply {
                      text = "YouTube"
                      textSize = 11f
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }

                  quickTabsRow.addView(btnSpotify)
                  quickTabsRow.addView(btnSoundCloud)
                  quickTabsRow.addView(btnYouTube)

                  controlsBox.addView(statusText)
                  controlsBox.addView(sonosRow)
                  controlsBox.addView(volumeRow)
                  controlsBox.addView(quickTabsRow)

                  webView = BackgroundAudioWebView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          0,
                          1f
                      )
                  }

                  CookieManager.getInstance().setAcceptCookie(true)
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true)

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      databaseEnabled = true
                      mediaPlaybackRequiresUserGesture = false
                      userAgentString = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
                      useWideViewPort = true
                      loadWithOverviewMode = true
                      builtInZoomControls = true
                      displayZoomControls = false
                  }

                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onPermissionRequest(request: PermissionRequest) {
                          runOnUiThread {
                              request.grant(request.resources)
                          }
                      }
                  }

                  webView.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(view: WebView, request: WebResourceRequest): Boolean {
                          val url = request.url.toString()
                          if (url.startsWith("http://") || url.startsWith("https://")) {
                              return false
                          }
                          return true
                      }
                  }

                  btnDiscover.setOnClickListener { discoverSonos() }

                  btnStart.setOnClickListener {
                      val sonosIp = ipInput.text.toString().trim()
                      if (sonosIp.isEmpty()) {
                          Toast.makeText(this, "Enter or scan Sonos IP first", Toast.LENGTH_SHORT).show()
                          return@setOnClickListener
                      }
                      syncSonosVolume(sonosIp)
                      if (checkPermissions()) {
                          val projectionManager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                          mediaProjectionLauncher.launch(projectionManager.createScreenCaptureIntent())
                      }
                  }

                  btnStop.setOnClickListener {
                      val stopIntent = Intent(this, AudioStreamService::class.java).apply {
                          action = AudioStreamService.ACTION_STOP
                      }
                      startService(stopIntent)
                      statusText.text = "Stream Stopped"
                  }

                  btnSpotify.setOnClickListener {
                      webView.loadUrl("https://open.spotify.com")
                  }

                  btnSoundCloud.setOnClickListener {
                      webView.loadUrl("https://soundcloud.com/discover")
                  }

                  btnYouTube.setOnClickListener {
                      webView.loadUrl("https://music.youtube.com")
                  }

                  rootLayout.addView(controlsBox)
                  rootLayout.addView(webView)
                  setContentView(rootLayout)

                  webView.loadUrl("https://open.spotify.com")
                  discoverSonos()
              }

              // Intercept phone hardware Volume Up / Down buttons to control Sonos speaker volume
              override fun onKeyDown(keyCode: Int, event: KeyEvent?): Boolean {
                  val sonosIp = ipInput.text.toString().trim()
                  if (sonosIp.isNotEmpty()) {
                      when (keyCode) {
                          KeyEvent.KEYCODE_VOLUME_UP -> {
                              val newVol = (volumeSeekBar.progress + 5).coerceAtMost(100)
                              volumeSeekBar.progress = newVol
                              thread { SonosController.setSonosVolume(sonosIp, newVol) }
                              return true
                          }
                          KeyEvent.KEYCODE_VOLUME_DOWN -> {
                              val newVol = (volumeSeekBar.progress - 5).coerceAtLeast(0)
                              volumeSeekBar.progress = newVol
                              thread { SonosController.setSonosVolume(sonosIp, newVol) }
                              return true
                          }
                      }
                  }
                  return super.onKeyDown(keyCode, event)
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack()
                  } else {
                      super.onBackPressed()
                  }
              }

              private fun discoverSonos() {
                  statusText.text = "Scanning Wi-Fi for Sonos Play:1..."
                  thread {
                      val foundIp = SonosController.discoverSonosIp()
                      runOnUiThread {
                          if (foundIp != null) {
                              ipInput.setText(foundIp)
                              statusText.text = "Found Sonos at $foundIp"
                              syncSonosVolume(foundIp)
                          } else {
                              statusText.text = "Scan timed out. Enter Sonos IP manually."
                          }
                      }
                  }
              }

              private fun syncSonosVolume(sonosIp: String) {
                  thread {
                      val currentVol = SonosController.getSonosVolume(sonosIp)
                      if (currentVol != null) {
                          runOnUiThread {
                              volumeSeekBar.progress = currentVol
                              volumeLabel.text = "Sonos Vol: $currentVol%"
                          }
                      }
                  }
              }

              private fun checkPermissions(): Boolean {
                  val permissions = mutableListOf(Manifest.permission.RECORD_AUDIO)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      permissions.add(Manifest.permission.POST_NOTIFICATIONS)
                  }
                  val missing = permissions.filter {
                      ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED
                  }
                  if (missing.isNotEmpty()) {
                      ActivityCompat.requestPermissions(this, missing.toTypedArray(), 100)
                      return false
                  }
                  return true
              }
          }
          EOF

          gradle assembleDebug --no-build-cache --no-daemon --stacktrace

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH="sonos_build/app/build/outputs/apk/debug/app-debug.apk"
          cp "$APK_PATH" ./Sonos-AirStream.apk
          gh release delete v1.0 -y --repo "${{ github.repository }}" || true
          gh release create v1.0 ./Sonos-AirStream.apk --repo "${{ github.repository }}" --title "Sonos AirStream APK v3.0 (Built-in Player + Volume Control)" --notes "Direct APK download with Sonos volume slider, hardware volume button control, and built-in Spotify/SoundCloud/YouTube player."
